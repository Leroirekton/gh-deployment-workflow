# Name of the workflow
name: Deploy to GitHub Pages

# Controls when the workflow will run
on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main
    # This is the key part: only run if the index.html file has changed
    paths:
      - 'index.html'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Step 1: Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Sets up the Pages environment
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Step 3: Uploads the artifact for the GitHub Pages build
      # This step takes the content of your repository and packages it
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Uploads the entire repository content
          path: '.'

  # This job deploys the uploaded artifact to GitHub Pages
  deploy:
    # It needs the build job to complete successfully first
    needs: build
    # Sets permissions for the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      pages: write
      id-token: write
    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Specifies the runner for deployment
    runs-on: ubuntu-latest
    steps:
      # Step 1: Deploys the artifact to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
